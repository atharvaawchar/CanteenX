services:
  - type: web
    name: canteenx
    env: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: sqlite-storage
      mountPath: /app/backend/database.sqlite
      sizeGB: 1
